[[rustfmt]]
args = []
id = "cD1"
name = "rustfmt"
order = 3
output = "target/.x-do/rust/fmt/rustfmt.log"
git_commit = true
commit_message = "before: format with rustfmt"
description = "【ENG】 Direct rustfmt / 【POL】 Bezpośrednie rustfmt"
