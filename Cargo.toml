[package]
name = "cargo-x-do"
version = "0.1.0-dev.2"
authors = ["Jan Roman Cisowski „j-Cis”"]
edition = "2024"
rust-version = "1.94.1"
description = "A modular, cross-platform task runner and workflow orchestrator for Rust projects. Automates git versioning, diagnostics, and project snapshots via local TOML configurations."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/j-Cis/cargo-x-do"
homepage = "https://crates.io/crates/cargo-x-do"
documentation = "https://docs.rs/cargo-x-do"

keywords = ["task", "build", "cargo", "plugin", "subcommand"]
categories = [
	"command-line-utilities",
	"development-tools",
	"development-tools::cargo-plugins",
	"development-tools::build-utils",
	"development-tools::testing",
]

resolver = "3"

[package.metadata.cargo]
edition = "2024"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[lints.rust]
unsafe_code = "forbid"
unused = "warn"

[lints.clippy]
pedantic = "warn"
too_many_arguments = "allow"
