# ./Cargo.toml

[package]
name = "cargo-x-do"
version = "0.1.0-dev.4"
authors = ["Jan Roman Cisowski „j-Cis” <code@cisowscy.com>"]
edition = "2024"
description = "Instant single-key TUI developer task runner, diagnostics, and code snapshot tool for Cargo."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/j-Cis/cargo-x-do"
homepage = "https://crates.io/crates/cargo-x-do"
documentation = "https://docs.rs/cargo-x-do"

keywords = ["task", "cargo", "plugin", "subcommand", "rust"]
categories = [
	"command-line-utilities",
	"development-tools",
	"development-tools::cargo-plugins",
	"development-tools::build-utils",
	"development-tools::testing",
]

resolver = "3"

[package.metadata.cargo]
edition = "2024"

[[bin]]
name = "cargo-x-do"
path = "src/main.rs"

[dependencies]
# anyhow = "1.0.102"
# chrono = "0.4.44"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
crossterm = "0.29.0"
inquire = "0.9.4"
# Silnik migawek i analizy drzewa plików
querypath = "1.0.0"
querypath-fmt = "1.1.0"
querypath-snapshot = "1.1.0"

#[lints.rust]
#unsafe_code = "forbid"
#unused = "warn"
#
#[lints.clippy]
#pedantic = "warn"
#too_many_arguments = "allow"
